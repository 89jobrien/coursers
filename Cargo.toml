[workspace]
members = [
    "crates/types",
    "crates/core",
    "crates/coursers",
    "crates/e2e",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/89jobrien/coursers"
rust-version = "1.89.0"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
coursers-types = { path = "crates/types", version = "^0.1.0" }
coursers-core = { path = "crates/core", version = "^0.1.0" }
# dirs v5.0.1 pulls windows-sys 0.48 while fd-lock v4.0.4 (latest as of 2026-08-03)
# pulls windows-sys 0.59, producing duplicate windows_* lock entries (cargo deny
# check bans). Tried bumping to dirs 6.0.0: it upgrades windows-sys but does NOT
# converge with fd-lock (still split, now 0.59 vs 0.61) and additionally introduces
# new duplicate groups (getrandom x3, r-efi x2, thiserror/thiserror-impl x2) via
# redox_users 0.5. Net loss — reverted. Revisit once fd-lock ships a windows-sys
# 0.6x release.
dirs = "5"
fd-lock = "4"
hex = "0.4"
miette = { version = "7", features = ["fancy"] }
# Pinned to a specific rev (not a local path) so `cargo outdated --workspace` and other
# tooling that copies the manifest to a tmp dir can resolve it. Bump `rev` to pick up
# prefixe changes; see https://github.com/89jobrien/prefixe. (2026-08-03)
prefixe = { git = "https://github.com/89jobrien/prefixe.git", rev = "91ce4d8f97e2748d07b3d870c28946b28881adc4" }
redb = "4.1"
regex = "1"
# nu-parser/nu-protocol removed: nu-engine 0.111-0.113 has a compilation bug
# (PipelineExecutionData missing `exit` field). We call `nu --ide-check` instead.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
