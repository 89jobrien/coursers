# cargo-deny configuration
# See: embarkstudios.github.io/cargo-deny/
#
# This file at the repo root IS cargo-deny's standard auto-discovery location —
# `cargo deny check` with no flags finds it here, no `--config` needed. The global
# `dep-audit` skill (~/.claude/skills/dep-audit) documents
# `--config .config/deny.toml`, which doesn't exist in this repo and silently falls
# back to defaults; that invocation should be fixed (or just drop the flag), not
# this file's location. (resolved 2026-08-03, was TODO(deny-config-path))

[advisories]
# TODO(deny-advisories-cvss4): `cargo deny check advisories` currently crashes with
# "unsupported CVSS version: 4.0" parsing RUSTSEC-2026-0073.md (libcrux-poly1305) in
# the cached advisory-db. Upstream cargo-deny 0.18.3 bug, not fixable here — track
# for a cargo-deny upgrade; until then advisory/CVE scanning is unavailable.
# (2026-07-30 gm-audit)
ignore = []

[licenses]
# Re-confirmed unmatched on 2026-08-03 (after the prefixe/dirs dependency changes
# above) via `cargo deny check licenses`: CC0-1.0, ISC, Unicode-DFS-2016, Zlib.
# Pruned. Re-add with a rationale comment if a future dependency needs one.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
